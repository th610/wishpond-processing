<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data View</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #5e60ad;
            padding-top: 30px;
            color: #333;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.1);
        }
        .btn-block {
            background-color: #49b8fd;
            color: white;
            margin-bottom: 20px;
        }
        .btn-block:hover {
            background-color: #49b8fd;
        }
        .table-container {
            overflow-x: auto;
            overflow-y: auto;
            max-height: 500px;
            margin-top: 20px;
        }
        table {
            white-space: nowrap;
            font-size: 14px;
        }
        th {
            position: sticky; /* 고정 위치 설정 */
            top: 0; /* 상단에 고정 */
            background-color: #000000; /* 컬럼 헤더 배경색 */
            color: white;
            font-weight: bold;
            text-align: center;
            z-index: 1; /* 스크롤 시 헤더가 다른 셀 위에 표시되도록 설정 */
        }
        td {
            padding: 10px;
            text-align: center;
        }
        .back-btn {
            background-color: #49b8fd;
            color: white;
            margin-top: 20px;
            display: block;
            width: 150px;
            text-align: center;
            padding: 10px;
            border-radius: 5px;
            text-decoration: none;
        }
        .back-btn:hover {
            background-color: #49b8fd;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center">Data Preview</h1>
        <p>Row count: {{ row_count }}, Column count: {{ col_count }}</p>

        <a href="/download_csv" class="btn btn-block">Download CSV</a>

        <div class="table-container">
            <table id="data-table" class="table table-striped table-bordered table-hover">
                <thead>
                    <tr>
                        <th style="position: sticky; top: 0; background-color: #000000; color: white; z-index: 2;">#</th> <!-- 인덱스 컬럼 고정 -->
                        {% for col in columns %}
                        <th>{{ col }}</th>
                        {% endfor %}
                    </tr>
                </thead>
                <tbody>
                    <!-- 첫 페이지 데이터를 JavaScript로 로드 -->
                </tbody>
            </table>
        </div>

        <a href="/" class="back-btn">Back to Home</a>
    </div>

    <script>
        let page = 1;
        let loading = false;

        // 페이지 첫 로드 시 첫 번째 데이터 페이지 가져오기
        loadData();

        // 스크롤 이벤트 리스너 추가
        document.querySelector('.table-container').addEventListener('scroll', function() {
            const container = document.querySelector('.table-container');
            if (container.scrollTop + container.clientHeight >= container.scrollHeight && !loading) {
                page += 1;
                loadData();
            }
        });

        // 데이터 로드 함수
        function loadData() {
            loading = true;
            fetch(`/load_data?page=${page}`)
                .then(response => response.json())
                .then(data => {
                    document.querySelector('#data-table tbody').insertAdjacentHTML('beforeend', data.data);
                    loading = false;
                })
                .catch(error => console.error('Error loading data:', error));
        }
    </script>
</body>
</html>
